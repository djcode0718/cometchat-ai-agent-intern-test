[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aster-row-agent"
version = "0.1.0"
description = "Reliable RAG Support Agent for Aster & Row"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["."]
executionEnvironments = [
  { root = "." }
]
