name: Live Evaluation

on:
  schedule:
    - cron: '0 2 * * *' # Nightly at 02:00 UTC
  workflow_dispatch:
    inputs:
      provider:
        description: 'LLM Provider to evaluate (groq, gemini, openrouter)'
        required: true
        default: 'groq'

jobs:
  live-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Live Evaluation Suite
        env:
          APP_ENV: production
          LLM_PROVIDER: ${{ github.event.inputs.provider || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          PYTHONPATH=. python evaluation/run_suite.py --output-name nightly_live_eval --check-thresholds

      - name: Upload Evaluation Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-results
          path: |
            docs/results/nightly_live_eval.json
            docs/results/nightly_live_eval.md
